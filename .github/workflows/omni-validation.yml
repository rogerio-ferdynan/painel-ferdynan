name: OMNI validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-cloud.mjs
      - run: node scripts/test-cloud.mjs
      - run: node scripts/test-agenda.mjs
      - run: node scripts/test-catalog.mjs
      - run: node scripts/test-tour.mjs
      - run: node scripts/build-netlify.mjs
