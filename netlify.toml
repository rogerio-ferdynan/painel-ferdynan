[build]
  command = "node scripts/build-netlify.mjs"
  publish = "netlify-public"

[build.environment]
  NODE_VERSION = "24"

# ALINE: serve static memorial before the catch-all proxy.
[[redirects]]
  from = "/Aline"
  to = "/Aline/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/Aline/"
  to = "/Aline/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/Aline/*"
  to = "/Aline/:splat"
  status = 200
  force = false

# Existing protected panel routes remain proxied unchanged.
[[redirects]]
  from = "/*"
  to = "https://painel-ferdynan-omni-231026.goldenwhale131.chatgpt.site/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
