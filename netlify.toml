[build]
  command = "node scripts/build-netlify.mjs"
  publish = "netlify-public"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/aline"
  to = "/aline/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/aline/"
  to = "/aline/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/Aline"
  to = "/aline"
  status = 301
  force = true

[[redirects]]
  from = "/Aline/"
  to = "/aline"
  status = 301
  force = true


# No shared upstream. Build generates routes only for the explicit deployment context.
